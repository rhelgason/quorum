name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # `npm install`, not `npm ci`: there is no committed lockfile yet, because
      # the environment this was authored in has no registry access. The first
      # contributor with network should run `npm install`, commit the resulting
      # package-lock.json, add `cache: npm` to the step above, and switch this
      # back to `npm ci`.
      - run: npm install --no-audit --no-fund

      # Tests need no dependencies at all — Node runs the TypeScript directly.
      # Running them before typecheck means a dependency-resolution problem
      # can't mask a real test failure.
      - run: npm run test:coverage

      - run: npm run typecheck
      - run: npm run build

  # The 15KB budget is a product requirement, not an optimization — frontend
  # teams reject widgets on bundle size. This job fails the build rather than
  # warning.
  #
  # It measures an upper bound: types and comments removed, then gzipped, with
  # no minification or tree shaking. A real bundler can only do better, so a
  # pass here is a genuine pass. See tools/size.
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # No install: the size tool has no dependencies either.
      - run: npm run size

  # The DOM layer. `ubuntu-latest` ships Chrome, and CHROME_PATH points at it.
  #
  # QUORUM_BROWSER_REQUIRED turns a skip into a failure. Without it a browser
  # that fails to launch looks exactly like a machine that has none, and this
  # job would go green while testing nothing — which is how the DOM layer went
  # unverified for a week in the first place.
  # KNOWN FLAKY — informational, does not gate the build.
  #
  # This job has run three times: once green (26/26, 0 skipped, ~4s of test
  # time) and twice hanging on `npm run test:browser` until the timeout killed
  # it. `--disable-dev-shm-usage` and `--no-sandbox` were added after the first
  # hang and did not stop the second, so the cause is not yet understood — and
  # GitHub does not serve logs for a job still in progress, which is what makes
  # it awkward to diagnose. The timeout is the containment.
  #
  # It is left running rather than deleted because when it passes it is the
  # only thing verifying the DOM layer, and its green run is what confirmed the
  # element picker works. `continue-on-error` so a flake does not make `main`
  # look broken; take a red or hung run here as "look at it", not "it failed".
  #
  # To resume: reproduce locally with a browser (`npm run test:browser`), and
  # if it is reliable there, the difference is the runner — suspect the
  # `after()` teardown leaving a handle open so the process never exits, which
  # would look exactly like this.
  browser:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Locate Chrome
        run: |
          which google-chrome || which chromium-browser || which chromium
          google-chrome --version || chromium --version
      - run: npm run test:browser
        env:
          QUORUM_BROWSER_REQUIRED: '1'
